.up{cursor:pointer;border:1px solid #fff;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:600;display:inline-block;margin:4px 0}.up:hover{background:#91D5CD;color:#1c2b33}
small{color:var(--mut);font-size:9.5px}tr.cb small,.hd small{color:inherit}
.k5{grid-template-columns:repeat(5,1fr)}@media(max-width:1000px){.k5{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.k5{grid-template-columns:1fr}}</style></head><body><div class="wrap">
<div class="hd"><div><small>BATANGAS STATE UNIVERSITY</small><h1>EXTENSION SERVICES PERFORMANCE DASHBOARD</h1><p>Consolidated Performance &amp; Budget Status Report</p></div><div class="r"><b>SOURCE: AOP · QEO · OPCR · OPMM</b><br>Office of Extension Services<br><label class="up">⭳ Add a quarter / year workbook (.xlsx)<input type="file" id="fx" accept=".xlsx,.xls" hidden></label><br><span id="src" style="opacity:.85"></span></div></div>
<div class="sc"><b style="align-self:center;font-size:13px">▼ Report scope</b><div><label>YEAR</label><select id="yr" class="sm"></select></div><div><label>QUARTER</label><div style="display:flex;gap:4px"><select id="qr" class="sm"></select><button id="delp" class="up" style="padding:3px 8px;border-color:var(--bd);color:var(--g)" title="Remove this uploaded period">✕</button></div></div><div><label>COLLEGE</label><select id="col"></select></div><div><label>EXTENSION PROGRAM</label><select id="prog"></select></div></div>
<div id="view" class="viewrow"></div>
<div class="nt" id="pernote" style="margin:-4px 0 8px"></div>
<div id="addbox" class="addbox" style="display:none">
 <b>Add this workbook as:</b>
 <span id="addfields" style="display:contents"><label>Year <input type="number" id="ay" min="2000" max="2100" style="width:72px"></label>
 <label>Quarter <select id="aq"><option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option></select></label>
 <button id="asave" class="up">Save</button></span>
 <button id="acancel" class="up" style="border-color:var(--bd);color:var(--mut)">Cancel</button>
 <div id="amsg" class="nt"></div>
</div>
<div class="tabs"><button data-t="O"></button><button data-t="A">A · Performance Indicators</button><button data-t="B">B · Activities &amp; Budget</button><button data-t="C">C · Documentary Requirements</button></div>
<div id="vO" class="v"></div><div id="vA" class="v"></div><div id="vB" class="v"></div><div id="vC" class="v"></div>
</div>
<script>
/*CORE*/
const S1=x=>x==null?'':String(x).replace(/\s+/g,' ').trim(),nt=x=>S1(x).toLowerCase();
const num=x=>typeof x==='number'?x:(typeof x==='string'&&/^-?\d+(\.\d+)?$/.test(x.trim())?parseFloat(x):null);
const qv=s=>{const m=/Q([1-4]),?\s*(\d{4})/i.exec(s||'');return m?+m[2]*4+ +m[1]-1:null};
const isPct=t=>/^Percentage|Rate$/i.test(t);
const dc=l=>/^submitted/i.test(l)?'S':/^not yet/i.test(l)?'D':/pending|overdue/i.test(l)?'P':'N';
const NOP='(No program listed)',asOf=new Date().getFullYear()*4+Math.floor(new Date().getMonth()/3);
/* ---- 2. PARSING / NORMALIZATION (workbook rows -> college/program/project/activity records) ---- */
function parseSheet(rows,sheet){
 const R={ind:[],acts:[],crows:[],name:'',code:'',progFull:{},sign:null};let sec=null,hdr=0,prog=NOP,proj=null;
 rows.forEach((r,ri)=>{const a=r[0],b=r[1],sa=typeof a==='string'?a.trim():a;
  if(typeof sa==='string'){let m;
   if(/^[ABC]\.\s/.test(sa)){sec=sa[0];hdr=0;return}
   if(m=/^(?:College|Department):\s*(.+?)(?:\s*\(([^)]+)\))?(?:\s+-\s+(.+))?$/i.exec(sa)){if(!R.name){R.name=S1(m[1]);R.code=m[2]?S1(m[2]):''}
    if(m[3]){const pm=/\(([^)]+)\)/.exec(m[3]);if(pm)R.progFull[pm[1]]=S1(m[3])}return}
   if(/^Prepared by/i.test(sa)){sec=null;const j=rows.findIndex((x,i)=>i>ri&&typeof x[0]==='string'&&x[0].trim());if(j>0)R.sign=[0,3,5].map(c=>[S1(rows[ri][c]),S1(rows[j][c]),S1(rows[j+1]&&rows[j+1][c])]);return}
   if(/^(Indicator_ ID|No\.|Act\. No\.)$/i.test(sa)&&b){hdr=1;return}
   if(m=/^PROGRAM\s+(.+?)\s+[|-]\s+P?PROJECT\s*(\d+)\s*(.*)$/i.exec(sa)){prog=S1(m[1]);let rest=m[3].trim();const fm=/\(([^()]*IMPLEMENTATION[^()]*)\)\s*$/i.exec(rest);if(fm)rest=rest.slice(0,fm.index).trim();proj={key:sa,no:+m[2],title:S1(rest),fy:fm?S1(fm[1]):''};return}
   if(/^PROGRAM\s/i.test(sa)){prog=S1(sa.replace(/^PROGRAM\s+/i,''));proj={key:sa,no:null,title:'',fy:''};return}
   if(/^(CONSOLIDATED|Extension Services)/i.test(sa))return}
  if(!hdr||!sec||a==null||typeof b!=='string')return;
  if(sec==='A')R.ind.push({id:/^PI-/i.test(S1(a))?S1(a):'',n:S1(a),pi:S1(b),src:S1(r[2]),t:num(r[3]),a:num(r[4]),v:num(r[5]),st:S1(r[6]),rem:r[7]==null?'':String(r[7]),u:isPct(S1(b))?'pct':'n'});
  else if(num(a)==null)return;
  else if(sec==='B')R.acts.push({prog,proj:proj||{key:'',no:null,title:'',fy:''},n:num(a),title:S1(b),t:S1(r[2]),a:S1(r[3]),s:S1(r[4]),alloc:num(r[5]),util:num(r[6]),rate:num(r[7]),note:typeof r[5]==='string'&&num(r[5])==null?S1(r[5]):'',unote:typeof r[6]==='string'&&num(r[6])==null?S1(r[6]):''});
  else if(sec==='C')R.crows.push({prog,title:S1(b),docs:[2,3,4,5,6,7].map(i=>r[i]==null?'N/A':S1(r[i]))})});
 const pool={};R.crows.forEach(c=>(pool[c.prog]=pool[c.prog]||[]).push(c));const cnt={};
 R.acts.forEach(a=>{const p=pool[a.prog]||[],i=cnt[a.prog]=(cnt[a.prog]||0)+1;let c=p[i-1];if(!c||c.used||nt(c.title)!==nt(a.title))c=p.find(x=>!x.used&&nt(x.title)===nt(a.title));if(c){c.used=1;a.docs=c.docs}else a.docs=null});
 if(!R.code)R.code=sheet.replace(/^REF_/i,'').replace(/_/g,' ');return R}
function wbRowsFn(wb){return n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null})}
function extractRowsMap(wb){const m={};wb.SheetNames.filter(n=>/^(CONSOLIDATED|REF_)/i.test(n)).forEach(n=>m[n]=wbRowsFn(wb)(n));return m}
function build(sheetNames,rows){const N=sheetNames;
 const cn=N.find(n=>/^CONSOLIDATED/i.test(n)),C=cn?parseSheet(rows(cn),cn):null,idm={};
 C&&C.ind.forEach(i=>idm[nt(i.pi)]=i.id);const cols={};
 N.filter(n=>/^REF_/i.test(n)).forEach(n=>{const P=parseSheet(rows(n),n);P.ind.forEach(i=>{if(!i.id&&idm[nt(i.pi)])i.id=idm[nt(i.pi)]});if(P.acts.length||P.ind.length)cols[P.code]=P});
 return{cons:C,cols}}
function buildFromWb(wb){return build(wb.SheetNames,wbRowsFn(wb))}
function buildFromRowsMap(m){return build(Object.keys(m),n=>m[n])}
/* ---- 3. FILTERING + 4. CALCULATIONS ---- */
let DB=null,EMBEDDED_DB=null,st={c:'ALL',p:'ALL',t:'O',per:'__embedded__'};
function scope(){const codes=Object.keys(DB.cols),cs=st.c==='ALL'?codes:[st.c];let acts=cs.flatMap(c=>DB.cols[c].acts.map(a=>({...a,col:c})));
 const level=st.c==='ALL'?'ALL':st.p==='ALL'?'COL':'PROG';if(level==='PROG')acts=acts.filter(a=>a.prog===st.p);
 return{level,cs,acts,ind:level==='ALL'?(DB.cons?DB.cons.ind:[]):DB.cols[st.c].ind}}
const sm=(x,k)=>x.reduce((s,a)=>s+a[k],0),ratio=(a,b)=>b?a/b*100:null;
function M(A){const stat={};A.forEach(a=>stat[a.s]=(stat[a.s]||0)+1);
 const cmp=A.filter(a=>qv(a.t)!=null&&(a.s==='Implemented'?qv(a.a)!=null:qv(a.t)<asOf)),ot=cmp.filter(a=>a.s==='Implemented'&&qv(a.a)===qv(a.t)).length;
 const al=A.filter(a=>a.alloc!=null),bu=al.filter(a=>a.util!=null),bb=sm(bu,'alloc'),bt=sm(bu,'util');
 const cells=A.flatMap(a=>(a.docs||[]).map((l,i)=>({c:dc(l),i}))),k=c=>cells.filter(x=>x.c===c).length,s=k('S'),d=k('D'),p=k('P');
 const pj=new Map();A.forEach(a=>{if(a.proj.no==null)return;const q=a.col+'|'+a.prog+'|'+a.proj.key;if(!pj.has(q))pj.set(q,[]);pj.get(q).push(a)});
 return{A,pjn:pj.size,pjc:[...pj.values()].filter(x=>x.every(a=>a.s==='Implemented')).length,n:A.length,stat,im:stat.Implemented||0,fi:stat['For Implementation']||0,cmp:cmp.length,ot,al:al.length,tb:sm(al,'alloc'),tu:sm(A.filter(a=>a.util!=null),'util'),bb,bt,rate:bb?bt/bb*100:null,
  noAl:A.length-al.length,s,d,p,na:k('N'),ap:s+d+p,due:s+p,cells,behind:A.filter(a=>a.s==='For Implementation'&&qv(a.t)!=null&&qv(a.t)<asOf),noUtil:al.filter(a=>a.util==null),
  pend:A.filter(a=>(a.docs||[]).some(l=>dc(l)==='P'))}}
/*ENDCORE*/
/* ---- 5. UI HELPERS ---- */
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pf=x=>x==null?'N/A':+x.toFixed(2)+'%',peso=n=>n==null?'N/A':'₱'+n.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}),nv=x=>x==null?'N/A':x;
const card=(ic,l,v,p,s1,s2='')=>`<div class="kc"><div class="kh"><span class="ic">${ic}</span><b>${l}</b></div><div class="kv">${v}</div>${p==null?'':`<div class="pb"><i style="width:${Math.min(p,100)}%"></i></div>`}<div class="ks">${s1}</div>${s2?`<div class="ki">${s2}</div>`:''}</div>`;
const P=(t,r,b,cl='')=>`<div class="p ${cl}"><h3><span>${t}</span><em>${r||''}</em></h3><div class="b">${b}</div></div>`;
const L=(t,a)=>P(t,'',`<ul>${a.map(i=>`<li>${i}</li>`).join('')}</ul>`);
